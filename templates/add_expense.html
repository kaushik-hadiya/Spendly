{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/expense_form.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container expense-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record a new expense in ₹</p>
        </div>

        <div class="auth-card">

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" class="form-input"
                           step="0.01" min="0.01" placeholder="250.00"
                           value="{{ values.get('amount', '') }}" required autofocus>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-input form-select" required>
                        <option value="">Choose a category</option>
                        {% for category in categories %}
                        <option value="{{ category }}"{% if values.get('category') == category %} selected{% endif %}>{{ category }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" class="form-input"
                           max="{{ today }}" value="{{ values.get('date', '') }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description <span class="form-optional">(optional)</span></label>
                    <input type="text" id="description" name="description" class="form-input"
                           maxlength="{{ max_description_length }}" placeholder="Lunch with team"
                           value="{{ values.get('description', '') }}">
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('profile') }}" class="btn-ghost">Cancel</a>
                    <button type="submit" class="btn-submit">Add expense</button>
                </div>
            </form>
        </div>

    </div>
</section>

{% endblock %}
