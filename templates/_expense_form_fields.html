{# Shared add/edit expense fields. Expects: values, categories, today, max_description_length. #}
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="form-group">
    <label for="amount">Amount (₹)</label>
    <input type="number" id="amount" name="amount" class="form-input"
           step="0.01" min="0.01" placeholder="250.00"
           value="{{ values.get('amount', '') }}" required autofocus>
</div>

<div class="form-group">
    <label for="category">Category</label>
    <select id="category" name="category" class="form-input form-select" required>
        <option value="">Choose a category</option>
        {% for category in categories %}
        <option value="{{ category }}"{% if values.get('category') == category %} selected{% endif %}>{{ category }}</option>
        {% endfor %}
    </select>
</div>

<div class="form-group">
    <label for="date">Date</label>
    <input type="date" id="date" name="date" class="form-input"
           max="{{ today }}" value="{{ values.get('date', '') }}" required>
</div>

<div class="form-group">
    <label for="description">Description <span class="form-optional">(optional)</span></label>
    <input type="text" id="description" name="description" class="form-input"
           maxlength="{{ max_description_length }}" placeholder="Lunch with team"
           value="{{ values.get('description', '') }}">
</div>
